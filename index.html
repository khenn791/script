<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .title {
            font-size: 32px;
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .message {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 30px;
            font-size: 16px;
            line-height: 2;
            color: #ccc;
            margin-bottom: 30px;
        }
        .message span {
            color: #ff0000;
            font-weight: bold;
        }
        .link {
            display: inline-block;
            padding: 15px 40px;
            background: #ff0000;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
        }
        .link:hover {
            background: #cc0000;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">⚠ NOTICE</div>
        <div class="message">
            We have created <span>something better</span><br>
            Please switch to our new site
        </div>
        <a class="link" href="https://protectscripts.vercel.app" target="_blank">
            protectscripts.vercel.app →
        </a>
    </div>
</body>
</html>
